version: 2
updates:
  # One pull request per month per group; majors come separately so a breaking bump is reviewed on its own.
  - package-ecosystem: pub
    directories:
      - /packages/holyrics_core
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
      pub-major:
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
